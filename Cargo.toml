# Workspace root for the NetcodePlus launcher.
#
# Members:
#   - src-tauri        Tauri 2.x desktop shell (binary).
#   - crates/manifest  Signed manifest schema and verification (no I/O).
#   - crates/planner   Pure update planning logic (no I/O).

[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/manifest",
    "crates/planner",
    "crates/host",
    "crates/net",
]

[workspace.package]
version = "1.6.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/jmortley/netcodeplus-launcher"
authors = ["NetcodePlus contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Centralised dependency versions for the workspace. Crates pull these in
# via `<dep> = { workspace = true }` in their own Cargo.toml.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
semver = { version = "1", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"
minisign-verify = "0.2"

# Atomic file replace for state-file writes (host crate).
tempfile = "3"

# Platform-aware standard directory lookups (Documents folder for the
# UT4 mod-paks dir).
dirs = "6"

# Windows .lnk (shell link) parsing, for resolving desktop shortcuts to
# the play install. Pure Rust — keeps the host crate `unsafe_code = deny`
# (the alternative, the `windows` crate's IShellLink, needs unsafe COM).
lnk = "0.6"

# Windows .lnk WRITING — creates the desktop shortcut to a freshly updated
# launcher exe (post-update housekeeping). Pure Rust (writes the .lnk binary
# directly), so it keeps `unsafe_code = deny`; the write counterpart to `lnk`.
mslnk = "0.1"

# Windows registry — read/clear the per-user "Run as administrator" compat flag
# (AppCompatFlags\Layers) on the game exe, which otherwise blocks launch with os
# error 740. Safe wrapper over the registry API, so no unsafe in our code.
winreg = "0.52"

# Win32 FFI, used only on Windows and each behind a documented
# `#[allow(unsafe_code)]` (the workspace default stays `unsafe_code = deny`):
# `SetProcessAffinityMask` (pin the launched game to a CPU-affinity mask),
# `ShellExecuteExW` (UAC-elevate the plugin install), and `MoveFileExW`
# (schedule deleting a still-locked old launcher exe on reboot —
# `Win32_Storage_FileSystem`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

# Network + streaming hashing (net crate).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"

# Dev-only: full minisign for signing test fixtures. Lives in
# workspace.dependencies so the version is pinned in one place even
# though only [dev-dependencies] sections reference it.
minisign = "0.9"

# Dev-only: HTTP server fixture for net crate tests.
wiremock = "0.6"
