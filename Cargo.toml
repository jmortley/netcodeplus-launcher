# Workspace root for the NetcodePlus launcher.
#
# Members:
#   - src-tauri        Tauri 2.x desktop shell (binary).
#   - crates/manifest  Signed manifest schema and verification (no I/O).
#   - crates/planner   Pure update planning logic (no I/O).

[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/manifest",
    "crates/planner",
    "crates/host",
    "crates/net",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/netcodeplus/netcodeplus-launcher"
authors = ["NetcodePlus contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Centralised dependency versions for the workspace. Crates pull these in
# via `<dep> = { workspace = true }` in their own Cargo.toml.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
semver = { version = "1", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"
minisign-verify = "0.2"

# Atomic file replace for state-file writes (host crate).
tempfile = "3"

# Network + streaming hashing (net crate).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "fs", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"

# Dev-only: full minisign for signing test fixtures. Lives in
# workspace.dependencies so the version is pinned in one place even
# though only [dev-dependencies] sections reference it.
minisign = "0.9"

# Dev-only: HTTP server fixture for net crate tests.
wiremock = "0.6"
