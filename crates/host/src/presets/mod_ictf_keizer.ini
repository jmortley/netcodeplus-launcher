; NetcodePlus competitive Mod.ini preset — "KeizeR (iCTF)".
; Captured from KeizeR's config 2026-09-01 and sanitized for shipping:
; [Identifiers]/[OldIdentifiers] (Epic account/alias), [LogoSplash]
; (hub-splash defaults), [NetcodePlus.Cosmetics] (personal hat/taunts),
; the InstagibCTF TakeScreenshot key (auto disk writes), plus the
; HighResScreenshotPostMatch and OriginalAnnouncerPath bookkeeping keys
; are stripped. The empty ForceModels Blue class is kept deliberately —
; KeizeR runs the stock blue model with only the tint forced. Applied as
; a SECTION MERGE — sections not listed here are left untouched in the
; player's Mod.ini. Lines before the first section header are ignored.

