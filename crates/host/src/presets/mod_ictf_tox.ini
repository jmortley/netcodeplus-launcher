; [Identifiers] (Epic account/alias), [LogoSplash] (hub-splash defaults),
; [BotRestrictions] (server-side leftover), [NetcodePlus.Cosmetics]
; (personal hat/taunts), the InstagibCTF TakeScreenshot key (auto disk
; writes), plus the HighResScreenshotPostMatch and OriginalAnnouncerPath
; bookkeeping keys are stripped. Applied as a SECTION MERGE — sections
; not listed here are left untouched in the player's Mod.ini. Lines
; before the first section header are ignored.

