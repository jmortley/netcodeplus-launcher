; NetcodePlus competitive Mod.ini preset — "Phantaci (duel / Wipeout)".
; Captured from phantaci's config 2026-09-01 and sanitized for shipping:
; [Identifiers]/[OldIdentifiers] (Epic account/alias), [HubTools] (consent
; flag), [LogoSplash] (hub-splash defaults), [NetcodePlus.Cosmetics]
; (personal hat/taunts), [HalloweenDecos]/[Snow] (seasonal), [UTPlus]
; (menu marker), [hcbindmenu] (machine state), the sprawling per-class
; Hide.* list in [NetcodePlus.WeaponSettings] (install-specific class
; names), plus the HighResScreenshotPostMatch and OriginalAnnouncerPath
; bookkeeping keys are stripped. Applied as a SECTION MERGE — sections
; not listed here are left untouched in the player's Mod.ini. Lines
; before the first section header are ignored.
; NB the enemy model (LiandriRobotNew) is the bright-material variant
; shipped in the NCStockWeapons content pak; on installs without that pak
; ForceModels falls back until the launcher updates content.

