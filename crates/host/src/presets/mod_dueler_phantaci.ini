; NetcodePlus competitive Mod.ini preset — "Dueler (Phantaci)".
; Captured from phantaci's config 2026-07-17 and sanitized for shipping:
; [Identifiers]/[OldIdentifiers] (Epic account/alias), [HubTools]
; (consent flag), [LogoSplash] (hub-splash defaults),
; [NetcodePlus.Cosmetics] (personal hat/taunts), [HalloweenDecos]/[Snow]
; (seasonal), [WeaponSkinsPlus]/[NetcodePlus.WeaponSettings]/[UTPL]
; (weapon hiding/skins — a personal call the preset must not force), plus
; the bSeenFirstRunMenu and HighResScreenshotPostMatch keys are stripped.
; Applied as a SECTION MERGE — sections not listed here are left
; untouched in the player's Mod.ini. Lines before the first section
; header are ignored.
; NB the enemy model (LiandriRobotNew) is the bright-material variant
; shipped in the NCStockWeapons content pak; on installs without that pak
; ForceModels falls back until the launcher updates content.

