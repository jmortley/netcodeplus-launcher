[package]
name = "ncp-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-system I/O for the NetcodePlus launcher: persistent state file and UT4 install detection."

[lints]
workspace = true

[dependencies]
ncp-planner = { path = "../planner" }
ncp-manifest = { path = "../manifest" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }

# Plugin ZIP extraction. Decompression only, pure-Rust deflate
# (flate2 + zlib-rs) — default features OFF drops bzip2/zstd/lzma/aes and
# their C deps, keeping the supply-chain surface (and `unsafe_code = deny`)
# minimal. UE4 plugin zips are standard deflate. The extractor enforces its
# own zip-slip guard; we never trust archive-internal paths. The ZIP bytes are
# already SHA-256-verified by ncp-net::download before extraction, so this
# crate does no hashing — it stays the filesystem boundary, no network dep.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Re-hash the plugin ZIP inside the elevated install child, so the elevated
# step re-verifies integrity itself (closes the verify→install TOCTOU) rather
# than trusting bytes the unelevated parent verified.
sha2 = { workspace = true }

# .lnk parsing is only used on Windows (desktop-shortcut detection);
# other targets fall back to directory probing + the folder picker.
[target.'cfg(windows)'.dependencies]
lnk = { workspace = true }
# One FFI call (SetProcessAffinityMask) for CPU-affinity pinning in
# `launch`, behind a documented `#[allow(unsafe_code)]`.
windows-sys = { workspace = true }

[dev-dependencies]
ncp-manifest = { path = "../manifest" }
semver = { workspace = true }
