[package]
name = "ncp-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Host-system I/O for the NetcodePlus launcher: persistent state file and UT4 install detection."

[lints]
workspace = true

[dependencies]
ncp-planner = { path = "../planner" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }

# .lnk parsing is only used on Windows (desktop-shortcut detection);
# other targets fall back to directory probing + the folder picker.
[target.'cfg(windows)'.dependencies]
lnk = { workspace = true }

[dev-dependencies]
ncp-manifest = { path = "../manifest" }
semver = { workspace = true }
