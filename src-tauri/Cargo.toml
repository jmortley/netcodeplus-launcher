[package]
name = "netcodeplus-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "NetcodePlus update launcher and game runner."

[lib]
# The `_lib` suffix is required so the lib name does not conflict with
# the bin name on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "netcodeplus_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Workspace crates that the Tauri commands wrap.
ncp-host = { path = "../crates/host" }
ncp-net = { path = "../crates/net" }

