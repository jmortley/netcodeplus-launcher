[package]
name = "netcodeplus-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "NetcodePlus update launcher and game runner."

[lib]
# The `_lib` suffix is required so the lib name does not conflict with
# the bin name on Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "netcodeplus_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Discord Rich Presence (opt-in, presence-only). Pure-Rust IPC client to the
# local Discord app — no native Game SDK. See src/presence.rs.
discord-rich-presence = "0.2"

# Custom `ncp://connect` URI scheme so ut4stats / Discord / the RP Join button can
# hand the launcher a connect intent. single-instance routes a link opened while
# we're already running into the existing app; its `deep-link` feature delivers
# the URL via the deep-link plugin's onOpenUrl. See lib.rs + src/main.ts.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Process enumeration for the connect flow — detect an already-running UT4 so
# the launcher can offer the in-game `open` console command instead of spawning
# a second game instance.
sysinfo = "0.30"

# OS credential store for the UT4 refresh token (Windows Credential Manager /
# macOS keychain / Linux keyutils). Native backends only — no D-Bus/secret-
# service dependency, so it builds clean on the Linux CI host too. Windows is the
# real runtime target; the Linux backend just needs to compile for CI.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

# Workspace crates that the Tauri commands wrap.
ncp-host = { path = "../crates/host" }
ncp-net = { path = "../crates/net" }
ncp-manifest = { path = "../crates/manifest" }
ncp-planner = { path = "../crates/planner" }

# Verifies update-manifest signatures against the compiled-in trust root
# (src/trust_root.rs). Same version the manifest crate uses, so the PublicKey
# type matches across the F1 verification path.
minisign-verify = { workspace = true }

# Manifest verification needs the current time (freshness check) and the
# running launcher version (min-launcher gate) at the command boundary.
chrono = { workspace = true }
semver = { workspace = true }

