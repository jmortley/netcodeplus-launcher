<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetcodePlus Launcher</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="bg-stack" aria-hidden="true">
      <div
        class="bg-layer"
        style="background-image: url('/backgrounds/skaarj.jpg')"
      ></div>
      <div
        class="bg-layer"
        style="background-image: url('/backgrounds/blitz.jpg')"
      ></div>
      <div
        class="bg-layer"
        style="background-image: url('/backgrounds/secret-level.jpg')"
      ></div>
    </div>
    <div class="bg-overlay" aria-hidden="true"></div>

    <main>
      <header>
        <h1>NetcodePlus Launcher</h1>
        <span id="version" class="version" aria-label="Launcher version">…</span>
      </header>

      <nav class="tabs">
        <button class="tab active" type="button" data-tab="launch">Launch</button>
        <button class="tab" type="button" data-tab="stats">Stats</button>
        <button class="tab" type="button" data-tab="community">Community</button>
        <button class="tab" type="button" data-tab="advanced">Advanced</button>
      </nav>

      <section id="tab-launch" class="tab-panel active">
        <div id="news-panel"></div>
        <div id="launch-panel" class="status">Detecting…</div>
      </section>

      <section id="tab-stats" class="tab-panel">
        <div id="stats-panel" class="status">…</div>
      </section>

      <section id="tab-community" class="tab-panel">
        <div class="status">
          <div id="pug-controls"></div>
          <p>Or chat with the community on Discord.</p>
          <div class="discord-btns">
            <button id="join-utpugs" type="button">Join a PUG — UTPugs Discord</button>
            <button id="join-ictf" type="button">Instagib Nation Discord</button>
          </div>
        </div>
      </section>

      <section id="tab-advanced" class="tab-panel">
        <h2>Launch options</h2>
        <div id="advanced-launch" class="status">…</div>
        <button id="pick-dir" type="button">Pick install folder</button>
        <h2>Performance config</h2>
        <div id="config-panel" class="status">…</div>
      </section>

      <footer>
        <p>
          Pre-alpha. Update planning and applying are implemented in the
          backend crates but not yet wired through this UI.
        </p>
      </footer>
    </main>
  </body>
</html>
